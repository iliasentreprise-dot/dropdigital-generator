<!doctype html>
<html lang="fr">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Commande confirmée</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;

  background:
    radial-gradient(
      circle at 50% 20%,
      #321052 0,
      transparent 38%
    ),
    #08010d;

  color:white;

  font-family:
    Arial,
    sans-serif;
}

.card{
  width:min(
    520px,
    calc(100% - 32px)
  );

  text-align:center;

  padding:
    54px
    34px;

  border:
    1px solid
    rgba(190,130,255,.3);

  background:
    rgba(17,5,27,.92);

  box-shadow:
    0 30px 100px
    rgba(0,0,0,.5);
}

.check{
  width:70px;
  height:70px;

  margin:
    0 auto
    25px;

  display:grid;
  place-items:center;

  border-radius:50%;

  background:#54e889;

  color:#07120a;

  font-size:36px;
  font-weight:900;

  box-shadow:
    0 0 40px
    rgba(84,232,137,.28);
}

h1{
  margin:0 0 14px;

  font-size:
    clamp(
      30px,
      7vw,
      43px
    );

  line-height:1;
}

.product{
  margin-bottom:20px;

  color:#c89cff;

  font-size:14px;

  font-weight:700;

  letter-spacing:.05em;
}

p{
  max-width:420px;

  margin:
    0 auto
    14px;

  color:#d1c3db;

  font-size:16px;

  line-height:1.65;
}

.email{
  color:white;
  font-weight:700;
}

.small{
  margin-top:25px;

  color:#84748f;

  font-size:12px;

  line-height:1.5;
}

.loading{
  color:#b99acb;
}

.error{
  color:#ff879d;
}

</style>

</head>

<body>

<div
  class="card"
  id="card"
>

  <p class="loading">
    Vérification du paiement…
  </p>

</div>

<script>

(async()=>{

  const card=
    document.getElementById(
      'card'
    );

  const params=
    new URLSearchParams(
      location.search
    );

  const sessionId=
    params.get(
      'session_id'
    )||'';

  const account=
    params.get(
      'account'
    )||'';

  try{

    const response=
      await fetch(
        '/api/checkout-status'+
        '?session_id='+
        encodeURIComponent(
          sessionId
        )+
        '&account='+
        encodeURIComponent(
          account
        )
      );

    const data=
      await response.json();

    if(
      !response.ok ||
      !data.paid
    ){
      throw new Error();
    }

    const product=
      data.product||
      'Votre produit';

    const email=
      data.email||
      '';

    card.innerHTML=`

      <div class="check">
        ✓
      </div>

      <h1>
        PAIEMENT CONFIRMÉ
      </h1>

      <div class="product">
        ${escapeHtml(product)}
      </div>

      <p>
        Merci pour votre commande.
      </p>

      <p>
        Votre produit va arriver
        dans votre boîte mail
        dans quelques instants.
      </p>

      ${
        email
        ? `
        <p class="email">
          ${escapeHtml(email)}
        </p>
        `
        : ''
      }

      <div class="small">
        Pensez à vérifier
        votre dossier spam
        ou courrier indésirable.
      </div>

    `;

  }catch(error){

    card.innerHTML=`

      <h1>
        VÉRIFICATION EN COURS
      </h1>

      <p class="error">
        Nous n'avons pas pu
        confirmer automatiquement
        le paiement.
      </p>

      <div class="small">
        Si vous venez de payer,
        rechargez cette page
        dans quelques instants.
      </div>

    `;

  }

})();

function escapeHtml(value){

  const element=
    document.createElement(
      'div'
    );

  element.textContent=
    String(value||'');

  return element.innerHTML;
}

</script>

</body>

</html>
