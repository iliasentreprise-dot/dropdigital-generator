<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paiement confirmé</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
min-height:100vh;
display:grid;
place-items:center;
background:#09010f;
color:white;
font-family:Arial,sans-serif
}
.card{
width:min(520px,calc(100% - 30px));
padding:50px 30px;
text-align:center;
background:#13071d;
border:1px solid #9b4dff55
}
.check{
width:70px;height:70px;
display:grid;place-items:center;
margin:0 auto 24px;
border-radius:50%;
background:#54e889;
color:#07120a;
font-size:35px;
font-weight:900
}
h1{margin:0 0 16px}
p{color:#cfc3d7;line-height:1.6}
a{
display:inline-block;
margin-top:18px;
padding:15px 22px;
background:#9b4dff;
color:white;
text-decoration:none;
font-weight:bold;
border-radius:8px
}
.small{font-size:12px;color:#897793;margin-top:20px}
</style>
</head>

<body>

<div class="card" id="card">
<p>Vérification du paiement…</p>
</div>

<script>
(async()=>{

const card=document.getElementById('card');
const params=new URLSearchParams(location.search);

const slug=params.get('slug')||'';
const sessionId=params.get('session_id')||'';

try{

  const response=await fetch(
    '/api/send-delivery',
    {
      method:'POST',
      headers:{
        'Content-Type':'application/json'
      },
      body:JSON.stringify({
        slug,
        session_id:sessionId
      })
    }
  );

  const data=await response.json();

  if(!response.ok||!data.deliveryUrl){
    throw new Error();
  }

  card.innerHTML=`
    <div class="check">✓</div>

    <h1>PAIEMENT CONFIRMÉ</h1>

    <p>
      Merci pour votre commande.
    </p>

    <p>
      ${
        data.emailSent
        ? 'Votre accès vient également d’être envoyé par email.'
        : 'Votre produit est prêt.'
      }
    </p>

    <a href="${data.deliveryUrl}">
      ACCÉDER À MON PRODUIT
    </a>

    <div class="small">
      ${
        data.email
        ? 'Adresse : '+data.email
        : 'Conservez cette page pour retrouver votre accès.'
      }
    </div>
  `;

}catch(error){

  card.innerHTML=`
    <h1>VÉRIFICATION EN COURS</h1>

    <p>
      Rechargez cette page dans quelques instants.
    </p>
  `;
}

})();
</script>

</body>
</html>
